<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- SEU CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg">

<!-- ================= CABEÇALHO ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-newcolor">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <i class="bi bi-calendar-check me-2"></i>
      Agenda e calendário para Professores
    </a>

    <a href="principal.html" class="btn btn-link text-white text-decoration-none">
      <i class="bi bi-arrow-left"></i> Voltar
    </a>
  </div>
</nav>

<!-- ================= CONTEÚDO ================= -->
<main class="container my-4">

  <h3 class="mb-4">
    <i class="bi bi-gear-fill me-2"></i> Configurações
  </h3>

  <!-- APARÊNCIA -->
  <div class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">Aparência</h5>

      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="temaSwitch">
        <label class="form-check-label" for="temaSwitch">
          Modo escuro
        </label>
      </div>
    </div>
  </div>

  <!-- CONTA -->
  <div class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">Conta</h5>
      <p class="text-muted mb-2">Gerencie informações da sua conta</p>

      <button class="btn btn-outline-primary w-100 mb-2">
        Alterar nome
      </button>

      <button class="btn btn-outline-primary w-100">
        Alterar senha
      </button>
    </div>
  </div>

  <!-- NOTIFICAÇÕES -->
  <div class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">Notificações</h5>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="notif1" checked>
        <label class="form-check-label" for="notif1">
          Receber lembretes do calendário
        </label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="notif2">
        <label class="form-check-label" for="notif2">
          Receber avisos por e-mail
        </label>
      </div>
    </div>
  </div>

  <!-- PRIVACIDADE -->
  <div class="card mb-3">
    <div class="card-body">
      <h5 class="card-title">Privacidade</h5>

      <button class="btn btn-outline-danger w-100">
        Encerrar sessão em todos os dispositivos
      </button>
    </div>
  </div>

</main>

<!-- ================= RODAPÉ ================= -->
<footer class="bg-newcolor text-white text-center py-3 mt-auto">
  Agenda e calendário para Professores © 2026
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="tema.js"></script>
</body>
</html>
