<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda de Professores</title>

    <link rel="icon" type="image/png" href="Imagens, videos e fivecon/school-time_11698254.png">

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- SEU CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <!-- MENU -->
    <div id="menu"></div>

    <!-- CONTEÚDO -->
    <main 
        id="principal" 
        class="container-fluid flex-fill d-flex align-items-center justify-content-center">

        <div class="p-5 shadow rounded text-center caixa-login">

            <h1 class="mb-5">Faça o cadastro Gratuitamente</h1>

            <a href="Cadastro.html" class="btn btn-primary">
                Ir para cadastro
            </a>

            <br><br>

            <p class="mt-2">
                Já é membro?
                <a href="login.html">
                    <strong>Clique aqui para entrar</strong>
                </a>
            </p>

        </div>
    </main>

    <!-- RODAPÉ -->
    <div id="rodape"></div>

    <!-- SCRIPTS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            fetch('cabecalhoinicial.html')
                .then(resp => resp.text())
                .then(html => document.getElementById('menu').innerHTML = html);

            fetch('rodape.html')
                .then(resp => resp.text())
                .then(html => document.getElementById('rodape').innerHTML = html);

        });
    </script>

    <!-- TEMA -->
    <script src="tema.js"></script>

</body>
</html>
