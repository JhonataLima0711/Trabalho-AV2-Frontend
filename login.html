<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <link rel="icon" type="image/png" href="Imagens, videos e fivecon/school-time_11698254.png">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SEU CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-vh-100 d-flex flex-column">

    <div id="menu"></div>

    <main
        id="principal"
        class="container-fluid flex-fill d-flex align-items-center justify-content-center"
    >
        <!-- caixa de login -->
        <div class="p-5 shadow rounded caixa-login"
             style="max-width: 700px; width: 100%;">

            <h2 class="text-center">Login</h2>

            <form id="formlogin">

                <div class="mb-2">
                    <label for="email" class="form-label">Digite email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu email"
                        required
                    >
                </div>

                <div class="mb-2">
                    <label for="senha" class="form-label">Senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha de 8 dígitos"
                        maxlength="8"
                        minlength="8"
                        required
                    >
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>

                <br>

                <div class="d-grid">
                    <a href="index.html" class="btn btn-secondary">Voltar</a>
                </div>

                <p class="mt-2 text-center">
                    Esqueceu a senha?
                    <a href="senhaetapa1.html">
                        <strong>Clique aqui</strong>
                    </a>
                </p>

            </form>
        </div>
    </main>

    <div id="rodape"></div>

    <!-- SCRIPTS (AGORA NO LUGAR CERTO) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {

            // HEADER / FOOTER
            fetch('cabecalhoinicial.html')
                .then(resp => resp.text())
                .then(html => document.getElementById('menu').innerHTML = html);

            fetch('rodape.html')
                .then(resp => resp.text())
                .then(html => document.getElementById('rodape').innerHTML = html);

            // LOGIN
            const form = document.getElementById("formlogin");

            form.addEventListener("submit", (e) => {
                e.preventDefault();

                alert("Login efetuado com sucesso!");
                window.location.href = "principal.html";
            });

        });
    </script>

    <!-- TEMA -->
    <script src="tema.js"></script>

</body>
</html>
